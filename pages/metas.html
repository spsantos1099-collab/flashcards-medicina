<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas · Controle Financeiro</title>
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-protegida="true" data-raiz="../">
  <main class="container pagina-app pagina-metas">
    <div class="topo-app">
      <div>
        <h1 class="topo-app__titulo">Metas</h1>
        <p class="topo-app__subtitulo">Objetivos financeiros claros, sem transformar tudo em uma planilha.</p>
      </div>
      <div class="topo-app__usuario">
        <span><strong data-usuario-resumo></strong></span>
        <button data-sair class="botao-sair" type="button">Sair</button>
      </div>
    </div>

    <nav class="nav-paginas" aria-label="Navegação principal">
      <a href="dashboard.html">Dashboard</a>
      <a href="receitas.html">Receitas</a>
      <a href="despesas.html">Despesas</a>
      <a href="cartoes.html">Cartões</a>
      <a href="calendario.html">Calendário</a>
      <a href="metas.html" class="ativa">Metas</a>
      <a href="relatorios.html">Relatórios</a>
      <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="cabecalho-pagina metas-cabecalho">
      <div class="metas-resumo" id="resumoMetas" aria-live="polite"></div>
      <button class="botao-novo" id="botaoNovaMeta" type="button">Nova meta</button>
    </div>

    <section id="listaMetas" class="grade-metas" aria-live="polite"></section>
  </main>

  <script type="module">
    import {
      observarUsuario, observarLista, adicionarRegistro,
      atualizarRegistro, removerRegistro
    } from "../js/firebase.js";
    import { formatarMoeda, formatarData, paraLista, hojeIso } from "../js/utils.js";
    import { abrirModal, fecharModal, confirmarExclusao } from "../components/modal.js";
    import { mostrarToast } from "../js/app.js";
    import {
      movimentosDaMeta, valorAtualMeta, percentualMeta,
      faltaMeta, previsaoMeta
    } from "../components/metas.js";

    let uidAtual = null;
    let metas = [];

    const listaMetas = document.getElementById("listaMetas");
    const resumoMetas = document.getElementById("resumoMetas");
    const botaoNovaMeta = document.getElementById("botaoNovaMeta");

    function escaparHtml(valor = "") {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function svg(nome) {
      const base = 'viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
      if (nome === "editar") return `<svg ${base}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>`;
      if (nome === "excluir") return `<svg ${base}><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>`;
      return "";
    }

    function renderizarResumo() {
      const totalAlvo = metas.reduce((soma, meta) => soma + (Number(meta.valorMeta) || 0), 0);
      const totalAtual = metas.reduce((soma, meta) => soma + valorAtualMeta(meta), 0);
      const concluidas = metas.filter((meta) => faltaMeta(meta) <= 0).length;

      resumoMetas.innerHTML = `
        <div><span>Guardado</span><strong class="numero">${formatarMoeda(totalAtual)}</strong></div>
        <div><span>Objetivos</span><strong class="numero">${formatarMoeda(totalAlvo)}</strong></div>
        <div><span>Concluídas</span><strong>${concluidas} de ${metas.length}</strong></div>
      `;
    }

    function historicoHtml(meta) {
      const movimentos = movimentosDaMeta(meta)
        .sort((a, b) => String(b.data || "").localeCompare(String(a.data || "")) || (Number(b.createdAt) - Number(a.createdAt)))
        .slice(0, 5);

      if (!movimentos.length) return "";

      return `
        <details class="meta-historico">
          <summary>Últimas movimentações</summary>
          <div class="meta-historico__lista">
            ${movimentos.map((movimento) => `
              <div class="meta-historico__item">
                <span>${movimento.data ? formatarData(movimento.data) : ""}${movimento.observacao ? ` · ${escaparHtml(movimento.observacao)}` : ""}</span>
                <strong class="numero ${Number(movimento.valor) >= 0 ? "valor-receita" : "valor-despesa"}">${Number(movimento.valor) >= 0 ? "+" : ""}${formatarMoeda(movimento.valor)}</strong>
              </div>
            `).join("")}
          </div>
        </details>
      `;
    }

    function renderizarMetas() {
      renderizarResumo();

      if (!metas.length) {
        listaMetas.innerHTML = `
          <div class="estado-vazio metas-vazio">
            <strong>Nenhuma meta cadastrada</strong>
            <span>Crie um objetivo como viagem, reserva de emergência ou uma compra importante.</span>
          </div>`;
        return;
      }

      const ordenadas = [...metas].sort((a, b) => {
        const concluidaA = faltaMeta(a) <= 0 ? 1 : 0;
        const concluidaB = faltaMeta(b) <= 0 ? 1 : 0;
        if (concluidaA !== concluidaB) return concluidaA - concluidaB;
        return String(a.dataLimite || "9999").localeCompare(String(b.dataLimite || "9999"));
      });

      listaMetas.innerHTML = ordenadas.map((meta) => {
        const atual = valorAtualMeta(meta);
        const alvo = Number(meta.valorMeta) || 0;
        const percentual = percentualMeta(meta);
        const falta = faltaMeta(meta);
        const previsao = previsaoMeta(meta);
        const concluida = falta <= 0;

        return `
          <article class="meta-card ${concluida ? "meta-card--concluida" : ""}" data-id="${meta.id}">
            <div class="meta-card__topo">
              <div>
                <div class="meta-card__titulo-linha">
                  <h2>${escaparHtml(meta.nome || "Meta")}</h2>
                  ${concluida ? '<span class="meta-status">Concluída</span>' : ""}
                </div>
                <p>${escaparHtml(meta.observacoes || previsao.texto)}</p>
              </div>
              <div class="meta-card__acoes">
                <button class="botao-icone" type="button" title="Editar meta" data-acao="editar" data-id="${meta.id}">${svg("editar")}</button>
                <button class="botao-icone botao-icone--perigo" type="button" title="Excluir meta" data-acao="excluir" data-id="${meta.id}">${svg("excluir")}</button>
              </div>
            </div>

            <div class="meta-card__valores">
              <div><span>Atual</span><strong class="numero">${formatarMoeda(atual)}</strong></div>
              <div><span>Meta</span><strong class="numero">${formatarMoeda(alvo)}</strong></div>
              <div><span>Falta</span><strong class="numero">${formatarMoeda(falta)}</strong></div>
            </div>

            <div class="meta-progresso" aria-label="${Math.round(percentual)}% concluído">
              <div class="meta-progresso__linha">
                <span>${Math.round(percentual)}%</span>
                <span>${escaparHtml(previsao.texto)}</span>
              </div>
              <div class="meta-progresso__trilho"><i style="width:${percentual}%"></i></div>
            </div>

            <div class="meta-card__rodape">
              <button class="botao-secundario botao-secundario--compacto" type="button" data-acao="movimentar" data-id="${meta.id}">${concluida ? "Ajustar valor" : "Adicionar valor"}</button>
              ${meta.dataLimite ? `<span>Prazo ${formatarData(meta.dataLimite)}</span>` : '<span>Sem prazo definido</span>'}
            </div>
            ${historicoHtml(meta)}
          </article>
        `;
      }).join("");
    }

    function abrirFormularioMeta(meta = null) {
      const editando = Boolean(meta);
      const overlay = abrirModal(`
        <h3 class="modal-titulo">${editando ? "Editar meta" : "Nova meta"}</h3>
        <p class="modal-texto">Defina o objetivo e, se já tiver algum valor separado, informe no campo inicial.</p>
        <form id="formularioMeta">
          <div class="grade-formulario">
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="metaNome">Nome da meta</label>
              <input id="metaNome" type="text" required maxlength="80" value="${escaparHtml(meta?.nome || "")}" placeholder="Ex: Reserva de emergência">
            </div>
            <div class="campo-formulario">
              <label for="metaValor">Valor da meta (R$)</label>
              <input id="metaValor" type="number" step="0.01" min="0.01" required value="${meta?.valorMeta ?? ""}">
            </div>
            <div class="campo-formulario">
              <label for="metaInicial">Já guardado (R$)</label>
              <input id="metaInicial" type="number" step="0.01" min="0" value="${meta?.valorInicial ?? "0"}">
            </div>
            <div class="campo-formulario">
              <label for="metaPrazo">Prazo <span class="campo-opcional">opcional</span></label>
              <input id="metaPrazo" type="date" value="${meta?.dataLimite || ""}">
            </div>
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="metaObservacoes">Observação <span class="campo-opcional">opcional</span></label>
              <textarea id="metaObservacoes" maxlength="180" placeholder="Ex: objetivo para dezembro">${escaparHtml(meta?.observacoes || "")}</textarea>
            </div>
          </div>
          <div class="modal-acoes">
            <button class="botao-secundario" type="button" data-fechar-modal>Cancelar</button>
            <button class="botao-primario" style="width:auto" type="submit">Salvar</button>
          </div>
        </form>
      `);

      overlay.querySelector("#formularioMeta").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const valorMeta = Number(overlay.querySelector("#metaValor").value);
        const valorInicial = Number(overlay.querySelector("#metaInicial").value) || 0;
        if (valorMeta <= 0 || valorInicial < 0) {
          mostrarToast("Confira os valores informados.", "erro");
          return;
        }

        const dados = {
          uid: uidAtual,
          nome: overlay.querySelector("#metaNome").value.trim(),
          valorMeta,
          valorInicial,
          dataLimite: overlay.querySelector("#metaPrazo").value || "",
          observacoes: overlay.querySelector("#metaObservacoes").value.trim(),
          updatedAt: Date.now()
        };

        try {
          if (editando) {
            await atualizarRegistro(uidAtual, "metas", meta.id, dados);
          } else {
            await adicionarRegistro(uidAtual, "metas", { ...dados, createdAt: Date.now() });
          }
          fecharModal();
          mostrarToast(editando ? "Meta atualizada." : "Meta criada.", "sucesso");
        } catch (_) {
          mostrarToast("Não foi possível salvar a meta.", "erro");
        }
      });
    }

    function abrirMovimentacao(meta) {
      const atual = valorAtualMeta(meta);
      const overlay = abrirModal(`
        <h3 class="modal-titulo">Movimentar ${escaparHtml(meta.nome)}</h3>
        <p class="modal-texto">Valor atual: <strong class="numero">${formatarMoeda(atual)}</strong></p>
        <form id="formularioMovimentoMeta">
          <div class="grade-formulario">
            <div class="campo-formulario">
              <label for="movimentoTipo">Movimento</label>
              <select id="movimentoTipo">
                <option value="adicionar">Adicionar valor</option>
                <option value="retirar">Retirar valor</option>
              </select>
            </div>
            <div class="campo-formulario">
              <label for="movimentoValor">Valor (R$)</label>
              <input id="movimentoValor" type="number" step="0.01" min="0.01" required>
            </div>
            <div class="campo-formulario">
              <label for="movimentoData">Data</label>
              <input id="movimentoData" type="date" required value="${hojeIso()}">
            </div>
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="movimentoObs">Observação <span class="campo-opcional">opcional</span></label>
              <input id="movimentoObs" type="text" maxlength="100" placeholder="Ex: transferência para a reserva">
            </div>
          </div>
          <div class="modal-acoes">
            <button class="botao-secundario" type="button" data-fechar-modal>Cancelar</button>
            <button class="botao-primario" style="width:auto" type="submit">Registrar</button>
          </div>
        </form>
      `);

      overlay.querySelector("#formularioMovimentoMeta").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const tipo = overlay.querySelector("#movimentoTipo").value;
        const informado = Number(overlay.querySelector("#movimentoValor").value);
        const valor = tipo === "retirar" ? -informado : informado;
        if (!informado || informado <= 0) return;
        if (tipo === "retirar" && informado > atual) {
          mostrarToast("O valor retirado não pode ser maior que o saldo da meta.", "erro");
          return;
        }

        try {
          await adicionarRegistro(uidAtual, `metas/${meta.id}/movimentos`, {
            valor,
            data: overlay.querySelector("#movimentoData").value,
            observacao: overlay.querySelector("#movimentoObs").value.trim(),
            createdAt: Date.now()
          });
          await atualizarRegistro(uidAtual, "metas", meta.id, { updatedAt: Date.now() });
          fecharModal();
          mostrarToast("Movimentação registrada.", "sucesso");
        } catch (_) {
          mostrarToast("Não foi possível registrar a movimentação.", "erro");
        }
      });
    }

    botaoNovaMeta.addEventListener("click", () => abrirFormularioMeta());

    listaMetas.addEventListener("click", async (evento) => {
      const botao = evento.target.closest("[data-acao]");
      if (!botao) return;
      const meta = metas.find((item) => item.id === botao.dataset.id);
      if (!meta) return;

      if (botao.dataset.acao === "editar") abrirFormularioMeta(meta);
      if (botao.dataset.acao === "movimentar") abrirMovimentacao(meta);
      if (botao.dataset.acao === "excluir") {
        const confirmou = await confirmarExclusao(`Excluir a meta “${meta.nome}” e todo o histórico dela?`);
        if (!confirmou) return;
        try {
          await removerRegistro(uidAtual, "metas", meta.id);
          mostrarToast("Meta excluída.", "sucesso");
        } catch (_) {
          mostrarToast("Não foi possível excluir a meta.", "erro");
        }
      }
    });

    observarUsuario((usuario) => {
      if (!usuario) return;
      uidAtual = usuario.uid;
      observarLista(uidAtual, "metas", (dados) => {
        metas = paraLista(dados);
        renderizarMetas();
      });
    });
  </script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
