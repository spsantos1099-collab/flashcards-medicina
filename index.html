<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Controle Financeiro</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-tela-login="true">

  <div class="tela-login">

    <!-- Painel de marca (some em telas pequenas para dar lugar ao formulário) -->
    <section class="painel-marca">
      <div class="painel-marca__logo">
        <span class="ponto"></span> Controle Financeiro
      </div>

      <div class="painel-marca__corpo">
        <h1 class="painel-marca__titulo">Suas finanças, sob controle, em um só lugar.</h1>
        <p class="painel-marca__subtitulo">
          Receitas, despesas, cartões e metas organizados automaticamente —
          sem precisar mais abrir uma planilha.
        </p>

        <!-- Elemento assinatura: linha de fluxo financeiro animada -->
        <svg class="painel-marca__grafico" viewBox="0 0 420 140" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M0 100 C 60 100, 60 40, 120 40 S 180 90, 240 70 S 300 20, 360 30 S 400 55, 420 45"
                stroke="#4FE8C3" stroke-width="3" stroke-linecap="round"/>
          <circle cx="420" cy="45" r="5" fill="#4FE8C3"/>
        </svg>
      </div>

      <p class="painel-marca__rodape">Feito para uso pessoal · seus dados são só seus</p>
    </section>

    <!-- Painel de formulário -->
    <section class="painel-formulario">
      <div class="formulario-login">

        <div class="formulario-login__cabecalho">
          <h2 class="formulario-login__titulo">Bem-vindo</h2>
          <p class="formulario-login__subtitulo" id="subtituloFormulario">Entre para continuar</p>
        </div>

        <div class="abas-login" role="tablist">
          <button class="aba-login ativa" id="abaEntrar" role="tab" aria-selected="true">Entrar</button>
          <button class="aba-login" id="abaCriarConta" role="tab" aria-selected="false">Criar conta</button>
        </div>

        <div id="mensagemFormulario" class="mensagem-formulario"></div>

        <button id="botaoGoogle" class="botao-google" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.05l3.01-2.34z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Continuar com Google
        </button>

        <div class="divisor-login">ou</div>

        <form id="formularioEmail" novalidate>
          <div class="campo-formulario">
            <label for="campoEmail">E-mail</label>
            <input type="email" id="campoEmail" name="email" autocomplete="email" required placeholder="voce@email.com">
          </div>
          <div class="campo-formulario">
            <label for="campoSenha">Senha</label>
            <input type="password" id="campoSenha" name="senha" autocomplete="current-password" required placeholder="••••••••" minlength="6">
          </div>
          <button type="submit" class="botao-primario" id="botaoEnviar">Entrar</button>
        </form>

      </div>
    </section>

  </div>

  <script type="module">
    import {
      entrarComGoogle,
      entrarComEmailSenha,
      cadastrarComEmailSenha,
      observarUsuario
    } from "./js/firebase.js";

    const abaEntrar = document.getElementById("abaEntrar");
    const abaCriarConta = document.getElementById("abaCriarConta");
    const subtitulo = document.getElementById("subtituloFormulario");
    const botaoEnviar = document.getElementById("botaoEnviar");
    const formulario = document.getElementById("formularioEmail");
    const campoEmail = document.getElementById("campoEmail");
    const campoSenha = document.getElementById("campoSenha");
    const botaoGoogle = document.getElementById("botaoGoogle");
    const mensagem = document.getElementById("mensagemFormulario");

    let modo = "entrar"; // 'entrar' | 'criar'

    function definirModo(novoModo) {
      modo = novoModo;
      const criando = modo === "criar";

      abaEntrar.classList.toggle("ativa", !criando);
      abaCriarConta.classList.toggle("ativa", criando);
      abaEntrar.setAttribute("aria-selected", String(!criando));
      abaCriarConta.setAttribute("aria-selected", String(criando));

      subtitulo.textContent = criando ? "Crie sua conta para começar" : "Entre para continuar";
      botaoEnviar.textContent = criando ? "Criar conta" : "Entrar";
      campoSenha.autocomplete = criando ? "new-password" : "current-password";
      esconderMensagem();
    }

    abaEntrar.addEventListener("click", () => definirModo("entrar"));
    abaCriarConta.addEventListener("click", () => definirModo("criar"));

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = `mensagem-formulario visivel ${tipo}`;
    }

    function esconderMensagem() {
      mensagem.className = "mensagem-formulario";
    }

    // Traduz os códigos de erro do Firebase para mensagens que fazem
    // sentido para quem não é da área técnica.
    function traduzirErro(codigo) {
      const mapa = {
        "auth/invalid-email": "Digite um e-mail válido.",
        "auth/user-not-found": "Não encontramos uma conta com esse e-mail.",
        "auth/wrong-password": "Senha incorreta. Tente novamente.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/email-already-in-use": "Já existe uma conta com esse e-mail. Tente entrar.",
        "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
        "auth/popup-closed-by-user": "Login cancelado."
      };
      return mapa[codigo] || "Algo deu errado. Tente novamente em instantes.";
    }

    function irParaDashboard() {
      window.location.href = "pages/dashboard.html";
    }

    botaoGoogle.addEventListener("click", async () => {
      esconderMensagem();
      botaoGoogle.disabled = true;
      try {
        await entrarComGoogle();
        irParaDashboard();
      } catch (erro) {
        mostrarMensagem(traduzirErro(erro.code), "erro");
        botaoGoogle.disabled = false;
      }
    });

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      esconderMensagem();

      const email = campoEmail.value.trim();
      const senha = campoSenha.value;

      botaoEnviar.disabled = true;
      botaoEnviar.textContent = "Aguarde...";

      try {
        if (modo === "criar") {
          await cadastrarComEmailSenha(email, senha);
        } else {
          await entrarComEmailSenha(email, senha);
        }
        irParaDashboard();
      } catch (erro) {
        mostrarMensagem(traduzirErro(erro.code), "erro");
        botaoEnviar.disabled = false;
        botaoEnviar.textContent = modo === "criar" ? "Criar conta" : "Entrar";
      }
    });

    // Se o usuário já estiver logado (sessão anterior), pula direto pro dashboard
    observarUsuario((usuario) => {
      if (usuario) irParaDashboard();
    });
  </script>
</body>
</html>
